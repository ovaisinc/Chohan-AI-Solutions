<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0c1220;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a2744;stop-opacity:1" />
    </linearGradient>
    
    <!-- Accent glow -->
    <radialGradient id="glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1600" height="900" fill="url(#bg)"/>
  
  <!-- Glow effect behind text -->
  <ellipse cx="800" cy="400" rx="500" ry="300" fill="url(#glow)"/>
  
  <!-- Grid pattern overlay -->
  <g opacity="0.03">
    <defs>
      <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
        <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#ffffff" stroke-width="0.5"/>
      </pattern>
    </defs>
    <rect width="1600" height="900" fill="url(#grid)"/>
  </g>
  
  <!-- Main headline: $200M -->
  <text x="800" y="320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="180" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-4">$200M</text>
  
  <!-- Subheadline -->
  <text x="800" y="380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="500" fill="#3b82f6" text-anchor="middle" letter-spacing="3">PARTNERSHIP</text>
  
  <!-- Accent line -->
  <line x1="700" y1="420" x2="900" y2="420" stroke="#3b82f6" stroke-width="3"/>
  
  <!-- Description -->
  <text x="800" y="470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="400" fill="#94a3b8" text-anchor="middle">OpenAI × Snowflake × Big Four Consulting</text>
  
  <!-- Stats row -->
  <g transform="translate(0, 580)">
    <!-- 80% Fortune 500 -->
    <text x="400" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="72" font-weight="800" fill="#ffffff" text-anchor="middle">80%</text>
    <text x="400" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" fill="#64748b" text-anchor="middle">FORTUNE 500</text>
    
    <!-- FRONTIER -->
    <text x="800" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="72" font-weight="800" fill="#3b82f6" text-anchor="middle">FRONTIER</text>
    <text x="800" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" fill="#64748b" text-anchor="middle">ENTERPRISE AI</text>
    
    <!-- 95% -->
    <text x="1200" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="72" font-weight="800" fill="#ffffff" text-anchor="middle">95%</text>
    <text x="1200" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" fill="#64748b" text-anchor="middle">PILOTS FAIL</text>
  </g>
  
  <!-- Consulting firms -->
  <text x="800" y="780" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600" fill="#475569" text-anchor="middle" letter-spacing="2">BCG • MCKINSEY • ACCENTURE • CAPGEMINI</text>
  
  <!-- Top accent bar -->
  <rect x="0" y="0" width="1600" height="6" fill="#3b82f6"/>
  
  <!-- Corner accents -->
  <rect x="0" y="0" width="100" height="2" fill="#3b82f6" opacity="0.5"/>
  <rect x="0" y="0" width="2" height="100" fill="#3b82f6" opacity="0.5"/>
  <rect x="1500" y="898" width="100" height="2" fill="#3b82f6" opacity="0.5"/>
  <rect x="1598" y="800" width="2" height="100" fill="#3b82f6" opacity="0.5"/>
</svg>