<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Premium gradient backgrounds -->
    <linearGradient id="heroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e1a;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#111827;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a0e1a;stop-opacity:1" />
    </linearGradient>
    
    <!-- Aurora gradient effect -->
    <linearGradient id="auroraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.3" />
      <stop offset="50%" style="stop-color:#8b5cf6;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:0.3" />
    </linearGradient>
    
    <!-- Glow effects -->
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="strongGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Base background -->
  <rect width="1600" height="900" fill="url(#heroGrad)"/>
  
  <!-- Abstract aurora wave effect -->
  <path d="M0,450 Q400,300 800,450 T1600,450 L1600,900 L0,900 Z" fill="url(#auroraGrad)" opacity="0.4"/>
  <path d="M0,600 Q400,450 800,600 T1600,600 L1600,900 L0,900 Z" fill="url(#auroraGrad)" opacity="0.2"/>
  
  <!-- Network nodes representing enterprise connections -->
  <g opacity="0.6">
    <!-- Central hub -->
    <circle cx="800" cy="450" r="80" fill="none" stroke="#3b82f6" stroke-width="2" opacity="0.3"/>
    <circle cx="800" cy="450" r="120" fill="none" stroke="#3b82f6" stroke-width="1" opacity="0.2"/>
    <circle cx="800" cy="450" r="160" fill="none" stroke="#8b5cf6" stroke-width="1" opacity="0.15"/>
    
    <!-- Outer nodes -->
    <circle cx="400" cy="300" r="12" fill="#1e293b" stroke="#3b82f6" stroke-width="2" filter="url(#softGlow)"/>
    <circle cx="1200" cy="300" r="12" fill="#1e293b" stroke="#3b82f6" stroke-width="2" filter="url(#softGlow)"/>
    <circle cx="400" cy="600" r="12" fill="#1e293b" stroke="#8b5cf6" stroke-width="2" filter="url(#softGlow)"/>
    <circle cx="1200" cy="600" r="12" fill="#1e293b" stroke="#8b5cf6" stroke-width="2" filter="url(#softGlow)"/>
    
    <!-- Connection lines -->
    <line x1="412" y1="300" x2="720" y2="400" stroke="#3b82f6" stroke-width="1.5" opacity="0.4"/>
    <line x1="1188" y1="300" x2="880" y2="400" stroke="#3b82f6" stroke-width="1.5" opacity="0.4"/>
    <line x1="412" y1="600" x2="720" y2="500" stroke="#8b5cf6" stroke-width="1.5" opacity="0.4"/>
    <line x1="1188" y1="600" x2="880" y2="500" stroke="#8b5cf6" stroke-width="1.5" opacity="0.4"/>
    
    <!-- Inter-node connections -->
    <line x1="412" y1="312" x2="412" y2="588" stroke="#64748b" stroke-width="1" opacity="0.2"/>
    <line x1="1188" y1="312" x2="1188" y2="588" stroke="#64748b" stroke-width="1" opacity="0.2"/>
  </g>
  
  <!-- Central icon representing AI/Enterprise fusion -->
  <g transform="translate(800, 450)">
    <!-- Outer ring -->
    <circle r="50" fill="none" stroke="url(#auroraGrad)" stroke-width="3" opacity="0.8"/>
    
    <!-- Inner hexagon representing structure -->
    <polygon points="0,-30 26,-15 26,15 0,30 -26,15 -26,-15" fill="none" stroke="#3b82f6" stroke-width="2" opacity="0.9"/>
    
    <!-- Center dot -->
    <circle r="8" fill="#3b82f6" filter="url(#softGlow)"/>
    
    <!-- Orbiting elements -->
    <circle cx="0" cy="-35" r="4" fill="#60a5fa" opacity="0.8">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="20s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Floating data particles -->
  <g opacity="0.3">
    <circle cx="200" cy="200" r="3" fill="#3b82f6"/>
    <circle cx="1400" cy="250" r="2" fill="#8b5cf6"/>
    <circle cx="300" cy="700" r="2.5" fill="#06b6d4"/>
    <circle cx="1300" cy="650" r="3" fill="#3b82f6"/>
    <circle cx="150" cy="500" r="2" fill="#8b5cf6"/>
    <circle cx="1450" cy="450" r="2.5" fill="#06b6d4"/>
  </g>
  
  <!-- Top accent bar -->
  <rect x="0" y="0" width="1600" height="4" fill="url(#auroraGrad)"/>
  
  <!-- Bottom gradient fade -->
  <rect x="0" y="800" width="1600" height="100" fill="url(#heroGrad)" opacity="0.9"/>
</svg>