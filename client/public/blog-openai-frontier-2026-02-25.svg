<svg width="1200" height="675" viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e17;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a2332;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGradient)"/>
  
  <!-- Grid pattern -->
  <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
    <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#3b82f6" stroke-width="0.5" opacity="0.08"/>
  </pattern>
  <rect width="1200" height="675" fill="url(#grid)"/>
  
  <!-- Glow effect -->
  <circle cx="600" cy="337" r="300" fill="url(#glow)"/>
  
  <!-- Accent lines -->
  <line x1="100" y1="337" x2="300" y2="337" stroke="#3b82f6" stroke-width="2" opacity="0.6"/>
  <line x1="900" y1="337" x2="1100" y2="337" stroke="#3b82f6" stroke-width="2" opacity="0.6"/>
  
  <!-- Category badge -->
  <rect x="500" y="160" width="200" height="36" rx="18" fill="rgba(59,130,246,0.15)" stroke="#3b82f6" stroke-width="1"/>
  <text x="600" y="184" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#3b82f6" text-anchor="middle" letter-spacing="2">ENTERPRISE AI STRATEGY</text>
  
  <!-- Main title -->
  <text x="600" y="280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" fill="#ffffff" text-anchor="middle">OpenAI's Frontier Alliances</text>
  
  <!-- Accent line -->
  <line x1="550" y1="310" x2="650" y2="310" stroke="#3b82f6" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Subtitle -->
  <text x="600" y="360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="400" fill="#94a3b8" text-anchor="middle">What the Big Four Consulting Play Means for Your AI Strategy</text>
  
  <!-- Meta info -->
  <text x="600" y="480" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" fill="#64748b" text-anchor="middle">Chohan AI Solutions • February 2026</text>
  
  <!-- Decorative elements -->
  <circle cx="200" cy="200" r="4" fill="#3b82f6" opacity="0.5"/>
  <circle cx="1000" cy="500" r="4" fill="#3b82f6" opacity="0.5"/>
  <circle cx="150" cy="450" r="3" fill="#60a5fa" opacity="0.4"/>
  <circle cx="1050" cy="180" r="3" fill="#60a5fa" opacity="0.4"/>
</svg>