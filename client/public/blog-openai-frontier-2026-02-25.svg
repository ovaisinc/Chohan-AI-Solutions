<svg width="1200" height="675" viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)"/>
  
  <!-- Grid lines -->
  <g opacity="0.1">
    <line x1="0" y1="135" x2="1200" y2="135" stroke="#3b82f6" stroke-width="1"/>
    <line x1="0" y1="270" x2="1200" y2="270" stroke="#3b82f6" stroke-width="1"/>
    <line x1="0" y1="405" x2="1200" y2="405" stroke="#3b82f6" stroke-width="1"/>
    <line x1="0" y1="540" x2="1200" y2="540" stroke="#3b82f6" stroke-width="1"/>
    <line x1="240" y1="0" x2="240" y2="675" stroke="#3b82f6" stroke-width="1"/>
    <line x1="480" y1="0" x2="480" y2="675" stroke="#3b82f6" stroke-width="1"/>
    <line x1="720" y1="0" x2="720" y2="675" stroke="#3b82f6" stroke-width="1"/>
    <line x1="960" y1="0" x2="960" y2="675" stroke="#3b82f6" stroke-width="1"/>
  </g>
  
  <!-- Central glowing orb -->
  <circle cx="600" cy="337" r="180" fill="url(#accentGrad)" opacity="0.15" filter="url(#glow)"/>
  <circle cx="600" cy="337" r="120" fill="url(#accentGrad)" opacity="0.2" filter="url(#glow)"/>
  
  <!-- Connection nodes representing partnerships -->
  <circle cx="300" cy="200" r="40" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="300" y="208" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#3b82f6" text-anchor="middle">AI</text>
  
  <circle cx="900" cy="200" r="40" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="900" y="208" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#3b82f6" text-anchor="middle">DATA</text>
  
  <circle cx="300" cy="475" r="40" fill="#1e293b" stroke="#8b5cf6" stroke-width="2"/>
  <text x="300" y="483" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#8b5cf6" text-anchor="middle">CONSULT</text>
  
  <circle cx="900" cy="475" r="40" fill="#1e293b" stroke="#8b5cf6" stroke-width="2"/>
  <text x="900" y="483" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#8b5cf6" text-anchor="middle">ENTERPRISE</text>
  
  <!-- Connection lines to center -->
  <line x1="340" y1="200" x2="520" y2="300" stroke="#3b82f6" stroke-width="2" opacity="0.6"/>
  <line x1="860" y1="200" x2="680" y2="300" stroke="#3b82f6" stroke-width="2" opacity="0.6"/>
  <line x1="340" y1="475" x2="520" y2="375" stroke="#8b5cf6" stroke-width="2" opacity="0.6"/>
  <line x1="860" y1="475" x2="680" y2="375" stroke="#8b5cf6" stroke-width="2" opacity="0.6"/>
  
  <!-- Central hub -->
  <circle cx="600" cy="337" r="60" fill="#0f172a" stroke="url(#accentGrad)" stroke-width="3"/>
  <text x="600" y="330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">$200M</text>
  <text x="600" y="355" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#94a3b8" text-anchor="middle">PARTNERSHIP</text>
  
  <!-- Big Four text -->
  <text x="600" y="580" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600" fill="#64748b" text-anchor="middle" letter-spacing="3">BCG • MCKINSEY • ACCENTURE • CAPGEMINI</text>
  
  <!-- 80% stat -->
  <rect x="100" y="100" width="140" height="70" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1" opacity="0.8"/>
  <text x="170" y="135" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="#3b82f6" text-anchor="middle">80%</text>
  <text x="170" y="155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="500" fill="#94a3b8" text-anchor="middle">FORTUNE 500</text>
  
  <!-- Frontier badge -->
  <rect x="960" y="100" width="140" height="70" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="1" opacity="0.8"/>
  <text x="1030" y="135" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#8b5cf6" text-anchor="middle">FRONTIER</text>
  <text x="1030" y="155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="500" fill="#94a3b8" text-anchor="middle">ENTERPRISE AI</text>
  
  <!-- Decorative dots -->
  <circle cx="150" cy="550" r="4" fill="#3b82f6" opacity="0.5"/>
  <circle cx="1050" cy="550" r="4" fill="#8b5cf6" opacity="0.5"/>
  <circle cx="120" cy="250" r="3" fill="#3b82f6" opacity="0.3"/>
  <circle cx="1080" cy="450" r="3" fill="#8b5cf6" opacity="0.3"/>
</svg>